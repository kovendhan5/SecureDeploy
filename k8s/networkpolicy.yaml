apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: securedeploy-app
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: securedeploy-app
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: securedeploy-app
    - namespaceSelector:
        matchLabels:
          monitoring: "true"
    ports:
    - protocol: TCP
      port: 8000
  egress:
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443
